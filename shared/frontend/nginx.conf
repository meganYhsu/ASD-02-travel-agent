server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        proxy_pass http://shared-app:3000;
    }

    location = /home {
        proxy_pass http://shared-app:3000;
    }

    location = /login {
        proxy_pass http://shared-app:3000;
    }

    location = /register {
        proxy_pass http://shared-app:3000;
    }

    location = /welcome {
        proxy_pass http://shared-app:3000;
    }

    location = /logout {
        proxy_pass http://shared-app:3000;
    }

    location /css/ {
        proxy_pass http://shared-app:3000;
    }




    #   -------------------------
    # Student 2
    # Booking and itinerary features
    #   -------------------------
    location /booking {
        proxy_pass http://student2-frontend:5002;
    }

    location /itinerary {
        proxy_pass http://student2-frontend:5002;
    }

    location /static/ {
    proxy_pass http://student2-frontend:5002;
    }


    #--------------------------
    #student 5
    #--------------------------

    location = /pre-trip {
    proxy_pass http://student5-frontend:8505/;
    }
    
    location /partials/ {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /documents {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /requirements {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /checklist {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /tasks {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /ai/ {
    proxy_pass http://student5-frontend:8505;
    }

        #--------------------------
    # Student 3
    # Budget and expense tracking
    #--------------------------

    location = /budget {
        proxy_pass http://student3-frontend:3003/;
    }

    location /api/ {
        proxy_pass http://student3-frontend:3003;
    }
    location = /css/styles.css {
        proxy_pass http://student3-frontend:3003/css/styles.css;
    }

    # -------------------------
    # Other student features
    # Add later
    # -------------------------


   # -------------------------
   # Student 4
   # Trip Planning
   # -------------------------

   location = /trip-planning {
       return 301 /trip-planning/;
   }

   location /trip-planning/ {
       proxy_pass http://student4-frontend:80/;
   }



}
