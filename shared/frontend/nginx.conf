server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        proxy_pass http://shared-app:5003;
    }

    location = /home {
        proxy_pass http://shared-app:5003;
    }

    location = /login {
        proxy_pass http://shared-app:5003;
    }

    location = /register {
        proxy_pass http://shared-app:5003;
    }

    location = /welcome {
        proxy_pass http://shared-app:5003;
    }

    location = /logout {
        proxy_pass http://shared-app:5003;
    }

    location /css/ {
        proxy_pass http://shared-app:5003;
    }




    #   -------------------------
    # Student 2 
    # Booking and itinerary features
    #   -------------------------
    location /booking {
        proxy_pass http://student2-frontend:5002;
    }

    location /itinerary {
        proxy_pass http://student2-frontend:5002;
    }

    location /static/ {
    proxy_pass http://student2-frontend:5002;
    }


    #--------------------------
    #student 5
    #--------------------------

    location = /pre-trip {
    proxy_pass http://student5-frontend:8505/;
    }
    
    location /partials/ {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /documents {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /requirements {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /checklist {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /tasks {
    proxy_pass http://student5-frontend:8505;
    }
    
    location /ai/ {
    proxy_pass http://student5-frontend:8505;
    }



    # -------------------------
    # Student 1
    # Traveler preferences
    # -------------------------

    location = /traveler-preferences {
        proxy_pass http://student1-frontend:3001/;
    }

    # NOTE: the traveler preferences page calls /api/* on its own origin.
    # A global "location /api/" block here would claim that prefix for this
    # feature alone, so it is deliberately left out - the live stack routes
    # through shared/frontend/app.py, which redirects to port 3001 and lets
    # the page talk to its own frontend directly.


    # -------------------------
    # Other student features
    # Add later
    # -------------------------


   # -------------------------
   # Student 4
   # Trip Planning
   # -------------------------

   location = /trip-planning {
       return 301 /trip-planning/;
   }

   location /trip-planning/ {
       proxy_pass http://student4-frontend:80/;
   }



}
