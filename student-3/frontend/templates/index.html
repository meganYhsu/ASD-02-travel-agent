<!DOCTYPE html>
<html>
<head>
    <title>Budget &amp; Expense Tracking</title>
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator { display: inline; }
        .error { color: #b00020; }
    </style>
</head>
<body>
<main class="wrap">
    <div class="page-header">
        <div>
            <h1>Budget &amp; Expense Tracking</h1>
            <p>Track planned versus actual spending for a trip.</p>
        </div>
    </div>

    <section class="card">
        <h2>Dashboard</h2>
        <button hx-get="/api/dashboard/1" hx-target="#dashboard">
            Load trip 1 dashboard
        </button>
        <div id="dashboard"></div>
        <div id="edit-form"></div>
    </section>

    <section class="card">
        <h2>Add expense</h2>
        <form hx-post="/api/expenses" hx-target="#dashboard">
            <input type="hidden" name="trip_id" value="1">
            <label>Description</label>
            <input name="description" required>
            <label>Amount (AUD)</label>
            <input name="amount" type="number" step="0.01" min="0" required>
            <label>Category</label>
            <select name="category_id">
                <option value="1">Accommodation</option>
                <option value="2">Food</option>
                <option value="3">Transport</option>
                <option value="4">Activities</option>
                <option value="5">Shopping</option>
            </select>
            <label>Date</label>
            <input name="expense_date" type="date">
            <button type="submit" class="primary-button">Save expense</button>
        </form>
    </section>

    <section class="card">
        <h2>AI budget analysis</h2>
        <button hx-post="/api/analyse/1" hx-target="#ai-result"
                hx-indicator="#ai-loading">
            Analyse budget
        </button>
        <span id="ai-loading" class="htmx-indicator">Analysing…</span>
        <div id="ai-result"></div>
    </section>
</main>
</body>
</html>
