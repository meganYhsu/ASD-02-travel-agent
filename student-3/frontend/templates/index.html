<!DOCTYPE html>
<html>

<head>
    <title>Budget &amp; Expense Tracking</title>
    <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <link rel="stylesheet" href="http://localhost:8080/css/styles.css" />
</head>

<body>
    <nav class="shared-nav">

        <div class="nav-title">
            Travel Agent
        </div>

        <div class="nav-links">

            <a href="http://127.0.0.1:8080/welcome">Welcome</a>

            <a href="http://127.0.0.1:8080/traveler-preferences">
                Traveler Preferences
            </a>

            <a href="http://127.0.0.1:8080/booking">
                Booking
            </a>

            <a href="http://127.0.0.1:8080/itinerary">
                Itinerary
            </a>

            <a href="http://127.0.0.1:8080/budget">
                Budget & Expense
            </a>

            <a href="http://127.0.0.1:8080/trip-planning">
                Trip Planning
            </a>

            <a href="http://127.0.0.1:8080/pre-trip">
                Travel Preparation
            </a>

            <a href="http://127.0.0.1:8080/account">
                Account
            </a>

            <a href="http://127.0.0.1:8080/logout">
                Log Out
            </a>

        </div>
    </nav>



    <main class="management-page">
        <div class="page-header">
            <div>
                <h1>Budget &amp; Expense Tracking</h1>
            </div>
        </div>

        <section class="section-card">
            <h2>Dashboard</h2>
            <button hx-get="/api/dashboard/1" hx-target="#dashboard">
                Load trip 1 dashboard
            </button>
            <div id="dashboard"></div>
            <div id="edit-form"></div>
        </section>

        <section class="section-card">
            <h2>Add expense</h2>
            <form hx-post="/api/expenses" hx-target="#dashboard">
                <input type="hidden" name="trip_id" value="1">
                <label>Description <input name="description" required></label>
                <label>Amount (AUD)
                    <input name="amount" type="number" step="0.01" min="0" required></label>
                <label>Category
                    <select name="category_id">
                        <option value="1">Accommodation</option>
                        <option value="2">Food</option>
                        <option value="3">Transport</option>
                        <option value="4">Activities</option>
                        <option value="5">Shopping</option>
                    </select>
                </label>
                <label>Date <input name="expense_date" type="date"></label>
                <button type="submit">Save expense</button>
            </form>
        </section>

        <section class="section-card">
            <h2>AI budget analysis</h2>
            <button hx-post="/api/analyse/1" hx-target="#ai-result" hx-indicator="#ai-loading">
                Analyse budget
            </button>
            <span id="ai-loading" class="htmx-indicator">Analysing…</span>

            <div id="ai-result"></div>
        </section>
    </main>
</body>

</html>
