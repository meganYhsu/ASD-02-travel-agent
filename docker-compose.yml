networks:
  travel-net:
    driver: bridge

volumes:
  ollama_data:
  student2_data:
  student5_data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - travel-net

  shared-frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./shared/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./shared/frontend/css:/usr/share/nginx/html/css:ro
      - ./shared/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - travel-net

  student2-database:
    build:
      context: ./student-2/database
    environment:
      PORT: "5402"
      DATABASE_PATH: /data/traveler_preferences.db
    volumes:
      - student2_data:/data
    ports:
      - "5402:5402"
    networks:
      - travel-net

  student2-backend:
    build:
      context: ./student-2/backend
    environment:
      PORT: "5502"
      DATABASE_SERVICE_URL: http://student2-database:5402
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_SECONDS: "120"
      COMPLETENESS_THRESHOLD: "75"
    ports:
      - "5502:5502"
    depends_on:
      - student2-database
      - ollama
    networks:
      - travel-net

  student2-frontend:
    build:
      context: ./student-2/frontend
    environment:
      PORT: "8502"
      BACKEND_URL: http://student2-backend:5502
    ports:
      - "8502:8502"
    depends_on:
      - student2-backend
    networks:
      - travel-net

  student5-database:
    build:
      context: ./student-5/database
    environment:
      PORT: "5405"
      DATABASE_PATH: /data/travel_docs.db
    volumes:
      - student5_data:/data
    ports:
      - "5405:5405"
    networks:
      - travel-net

  student5-backend:
    build:
      context: ./student-5/backend
    environment:
      PORT: "5505"
      DATABASE_SERVICE_URL: http://student5-database:5405
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_SECONDS: "60"
      EXPIRY_WARNING_DAYS: "90"
    ports:
      - "5505:5505"
    depends_on:
      - student5-database
      - ollama
    networks:
      - travel-net

  student5-frontend:
    build:
      context: ./student-5/frontend
    environment:
      PORT: "8505"
      BACKEND_URL: http://student5-backend:5505
    ports:
      - "8505:8505"
    depends_on:
      - student5-backend
    networks:
      - travel-net
