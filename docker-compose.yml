networks:
  travel-net:
    driver: bridge

volumes:
  ollama_data:
  student4_data:
  student5_data:

services:

  # ====================
  # Shared Home
  # ====================

  shared-home:
    build:
      context: ./shared/frontend

    ports:
      - "8080:5003"

    depends_on:
      - student1-frontend
      - student2-frontend
      - student3-frontend
      - student4-frontend
      - student5-frontend

    networks:
      - travel-net

  # ====================
  # Shared Ollama
  # ====================

  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - travel-net

  # ====================
  # Shared RAG
  # ====================

  rag-server:
    build:
      context: ./ai-services/rag-server

    environment:
      PORT: "7005"
      RAG_DOCUMENT_PATHS: /app/knowledge:/knowledge/student-5-readme.md
      RAG_GENERATION_ENABLED: "false"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_SECONDS: "120"

    volumes:
      - ./student-5/README.md:/knowledge/student-5-readme.md:ro

    ports:
      - "7005:7005"

    depends_on:
      - ollama

    networks:
      - travel-net

  # ====================
  # Student 1
  # ====================

  student1-database:
    build:
      context: ./student-1/database

    ports:
      - "6001:6001"

    networks:
      - travel-net

  student1-backend:
    build:
      context: ./student-1/backend

    environment:
      DB_API_URL: http://student1-database:6001
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      MCP_BASE_URL: http://host.docker.internal:7004
      MCP_ENABLED: "true"
      RAG_BASE_URL: http://host.docker.internal:7001
      RAG_ENABLED: "true"

    # Lets host.docker.internal reach the host-run MCP and RAG servers on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "5001:5001"

    depends_on:
      - student1-database
      - ollama

    networks:
      - travel-net

  student1-frontend:
    build:
      context: ./student-1/frontend

    environment:
      BACKEND_URL: http://student1-backend:5001

    ports:
      - "3001:3001"

    depends_on:
      - student1-backend

    networks:
      - travel-net

  # ====================
  # Student 4
  # ====================

  student4-database:
    build:
      context: ./student-4/database

    volumes:
      - student4_data:/app/data

    ports:
      - "6004:5002"

    networks:
      - travel-net

  student4-backend:
    build:
      context: ./student-4/backend

    env_file:
      - path: ./student-4/backend/.env
        required: false

    environment:
      DATABASE_BASE_URL: http://student4-database:5002
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: llama3.2:3b
      MCP_BASE_URL: http://host.docker.internal:7004
      RAG_SERVICE_URL: http://host.docker.internal:7001

    ports:
      - "5004:5001"

    depends_on:
      - student4-database
      - ollama

    networks:
      - travel-net

  student4-frontend:
    build:
      context: ./student-4/frontend

    ports:
      - "3004:80"

    depends_on:
      - student4-backend

    networks:
      - travel-net

  # ====================
  # Student 3
  # ====================

  student3-database:
    build:
      context: ./student-3/database

    ports:
      - "6003:6003"

    networks:
      - travel-net

  student3-backend:
    build:
      context: ./student-3/backend

    environment:
      DB_API_URL: http://student3-database:6003
      TRIP_API_URL: http://student4-database:5002
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://host.docker.internal:7004
      RAG_SERVER_URL: http://host.docker.internal:7001
      RAG_CALLER: student-3-budget
      RAG_TIMEOUT_SECONDS: "300"
      MCP_ENABLED: "true"
      RAG_ENABLED: "true"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "5003:5003"

    depends_on:
      - student3-database
      - student4-database
      - ollama

    networks:
      - travel-net

  student3-frontend:
    build:
      context: ./student-3/frontend

    environment:
      BACKEND_URL: http://student3-backend:5003

    ports:
      - "3003:3003"

    depends_on:
      - student3-backend

    networks:
      - travel-net
  # ====================
  # Student 5
  # ====================

  student5-database:
    build:
      context: ./student-5/database

    environment:
      PORT: "5405"
      DATABASE_PATH: /data/travel_docs.db

    volumes:
      - student5_data:/data

    ports:
      - "5405:5405"

    networks:
      - travel-net

  student5-backend:
    build:
      context: ./student-5/backend

    environment:
      PORT: "5505"
      DATABASE_SERVICE_URL: http://student5-database:5405
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_SECONDS: "180"
      RAG_SERVICE_URL: http://rag-server:7005
      RAG_TIMEOUT_SECONDS: "130"
      EXPIRY_WARNING_DAYS: "90"

    ports:
      - "5505:5505"

    depends_on:
      - student5-database
      - ollama
      - rag-server

    networks:
      - travel-net

  student5-frontend:
    build:
      context: ./student-5/frontend

    environment:
      PORT: "8505"
      BACKEND_URL: http://student5-backend:5505

    ports:
      - "8505:8505"

    depends_on:
      - student5-backend

    networks:
      - travel-net

  # ====================
  # Student 2
  # ====================

  student2-database:
    build:
      context: ./student-2/database

    ports:
      - "6002:5000"

    networks:
      - travel-net

  student2-backend:
    build:
      context: ./student-2/backend

    environment:
      DATABASE_URL: http://student2-database:5000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      MCP_URL: http://host.docker.internal:7004
      RAG_URL: http://host.docker.internal:7001

    ports:
      - "5002:5001"

    depends_on:
      - student2-database
      - ollama

    networks:
      - travel-net

  student2-frontend:
    build:
      context: ./student-2/frontend

    environment:
      BACKEND_URL: http://student2-backend:5001

    ports:
      - "3002:5002"

    depends_on:
      - student2-backend

    networks:
      - travel-net
