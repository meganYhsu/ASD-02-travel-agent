  networks:
  travel-net:
    driver: bridge


volumes:
  ollama_data:
  student5_data:


services:

  ollama:
    image: ollama/ollama:latest

    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - travel-net


  shared-frontend:
    image: nginx:1.27-alpine

    ports:
      - "8080:80"

    volumes:
      - ./shared/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./shared/frontend/css:/usr/share/nginx/html/css:ro
      - ./shared/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - student3-frontend

    networks:
      - travel-net


  # -------------------------
  # Student 3
  # -------------------------

  student3-database:
    build:
      context: ./student-3/database

    ports:
      - "5000:5000"

    networks:
      - travel-net


  student3-backend:
    build:
      context: ./student-3/backend

    environment:
      DATABASE_URL: http://student3-database:5000
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b

    ports:
      - "5001:5001"

    depends_on:
      - student3-database
      - ollama

    networks:
      - travel-net


  student3-frontend:
    build:
      context: ./student-3/frontend

    environment:
      BACKEND_URL: http://student3-backend:5001

    ports:
      - "5002:5002"

    depends_on:
      - student3-backend

    networks:
      - travel-net


  # -------------------------
