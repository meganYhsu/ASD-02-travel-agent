name: Student 2 - Build and Validate Microservices

on:
  push:
    paths:
      - "student-2/**"
      - "docker-compose.yml"
      - ".github/workflows/student-2.yml"

  pull_request:
    paths:
      - "student-2/**"
      - "docker-compose.yml"
      - ".github/workflows/student-2.yml"

  workflow_dispatch:

jobs:
  validate-student-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          if [ -f student-2/backend/requirements.txt ]; then
            pip install -r student-2/backend/requirements.txt
          fi

      - name: Install database dependencies
        run: |
          if [ -f student-2/database/requirements.txt ]; then
            pip install -r student-2/database/requirements.txt
          fi

      - name: Install frontend dependencies
        run: |
          if [ -f student-2/frontend/requirements.txt ]; then
            pip install -r student-2/frontend/requirements.txt
          fi

      - name: Validate Python syntax
        run: python -m compileall student-2/backend student-2/database student-2/frontend

      - name: Build backend Docker image
        run: docker build -t student-2-backend ./student-2/backend

      - name: Build database Docker image
        run: docker build -t student-2-database ./student-2/database

      - name: Build frontend Docker image
        run: docker build -t student-2-frontend ./student-2/frontend