name: Student 1 - Build and Validate Microservices

on:
  push:
    paths:
      - "student-1/**"
      - "docker-compose.yml"
      - ".github/workflows/student-1.yml"

  pull_request:
    paths:
      - "student-1/**"
      - "docker-compose.yml"
      - ".github/workflows/student-1.yml"

  workflow_dispatch:

jobs:
  validate-student-1:
    runs-on: ubuntu-latest

    # CI and the cloud baseline: every AI service is off. The shared AI
    # servers run on a developer's machine, not in CI.
    env:
      AI_MODE_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"

    defaults:
      run:
        working-directory: student-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install microservice and test dependencies
        run: |
          pip install -r database/requirements.txt -r backend/requirements.txt -r frontend/requirements.txt
          pip install pytest pip-audit

      - name: Validate Python syntax
        run: python -m compileall -q database backend frontend tests tools

      - name: Audit pinned dependencies (pip-audit)
        run: pip-audit -r database/requirements.txt -r backend/requirements.txt -r frontend/requirements.txt

      - name: Create database and validate seed data
        run: |
          python -c "import sys; sys.path.insert(0, 'database'); from db_api import init_db; init_db()"
          python tests/check_seed.py

      - name: "Post-commit endpoint tests: POST /travelers and POST /travelers/<id>/update"
        run: python -m pytest tests/test_release2_endpoints.py -v --junitxml=test-results/release2-endpoints.xml

      - name: Release 2 Multi-Agent and cloud-baseline tests
        run: python -m pytest tests/test_release2_multi_agent.py tests/test_release2_cloud_ready.py -v --junitxml=test-results/release2-multi-agent-cloud.xml

      - name: Start microservices
        run: |
          python database/db_api.py &
          python backend/app.py &
          python frontend/app.py &
          sleep 8

      - name: Smoke test live endpoints
        run: python tests/test_endpoints.py

      - name: Test full CRUD cycle
        run: python tests/test_crud_cycle.py

      - name: Validate MCP integration (disabled in CI)
        run: python tests/test_mcp.py

      - name: Validate RAG integration (disabled in CI)
        run: python tests/test_rag.py

      - name: Build Docker images
        run: |
          docker build -t student-1-database database
          docker build -t student-1-backend backend
          docker build -t student-1-frontend frontend

      - name: Run the containers like the cloud deployment and smoke test them
        run: |
          docker network create s1net
          docker run -d --name student1-database --network s1net student-1-database
          docker run -d --name student1-backend --network s1net \
            -e DB_API_URL=http://student1-database:6001 student-1-backend
          docker run -d --name student1-frontend --network s1net -p 3101:3001 \
            -e BACKEND_URL=http://student1-backend:5001 student-1-frontend
          sleep 8
          python tests/cloud_smoke.py --frontend http://127.0.0.1:3101 --expect-ai off --json test-results/cloud-smoke-ci.json

      - name: Container logs
        if: failure()
        run: |
          docker logs student1-database || true
          docker logs student1-backend || true
          docker logs student1-frontend || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-1-test-results
          path: student-1/test-results/
